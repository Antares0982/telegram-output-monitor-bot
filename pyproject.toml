[project]
name = "telegram-output-monitor-bot"
version = "0.1.0"
description = "Forward logs from a RabbitMQ topic exchange to a Telegram chat."
requires-python = ">=3.11"
dependencies = [
    "aio-pika",
    "python-telegram-bot",
]

[project.scripts]
monitor = "monitor:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["monitor.py"]
